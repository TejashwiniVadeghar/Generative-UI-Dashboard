<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Visual Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #020617;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 580px;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .subtitle { margin: 0 0 18px 0; font-size: 14px; color: #94a3b8; }
    .demo-btn {
      background-color: #1e293b;
      color: #60a5fa;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .demo-btn:hover { background-color: #334155; }
    .key-input {
      width: 100%;
      background-color: #020617;
      border: 1px solid #1e293b;
      color: #cbd5e1;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 14px;
      outline: none;
    }
    .key-input:focus, .prompt-input:focus { border-color: #3b82f6; }
    .prompt-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .prompt-input {
      flex: 1;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    .gen-btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .gen-btn:hover { background-color: #3b82f6; }
    .gen-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-box {
      display: none;
      background-color: rgba(127, 29, 29, 0.4);
      border: 1px solid #991b1b;
      color: #fca5a5;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 16px;
    }
    .result-area { display: none; }
    .chart-title {
      margin: 0 0 16px 0;
      font-size: 17px;
      font-weight: 600;
      color: #60a5fa;
    }
    .bar-row { margin-bottom: 14px; }
    .bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .bar-percent { color: #94a3b8; }
    .bar-track {
      width: 100%;
      height: 14px;
      background-color: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 999px;
      width: 0%;
      transition: width 0.6s ease-out;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>AI Mini Dashboard</h1>
      <button onclick="runDemo()" class="demo-btn">✨ Try Demo Mode</button>
    </div>
    <p class="subtitle">Generate instant visual charts using Gemini AI.</p>

    <input id="apiKeyInput" type="password" class="key-input" placeholder="Paste your Google AI Studio API Key here..." />

    <div class="prompt-row">
      <input id="promptInput" type="text" class="prompt-input" placeholder="e.g., Top 4 programming languages popularity" />
      <button onclick="generateChart()" id="btn" class="gen-btn">Generate</button>
    </div>

    <div id="errorBox" class="error-box"></div>

    <div id="resultArea" class="result-area">
      <h2 id="chartTitle" class="chart-title"></h2>
      <div id="barsContainer"></div>
    </div>
  </div>

  <script>
    function renderBars(chartData) {
      document.getElementById("chartTitle").innerText = chartData.title;
      const container = document.getElementById("barsContainer");
      container.innerHTML = "";

      chartData.items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "bar-row";
        row.innerHTML = `
          <div class="bar-labels">
            <span>${item.label}</span>
            <span class="bar-percent">${item.value}%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" id="bar-${index}"></div>
          </div>
        `;
        container.appendChild(row);

        // Trigger smooth bar width animation right after rendering
        setTimeout(() => {
          document.getElementById(`bar-${index}`).style.width = `${item.value}%`;
        }, 50);
      });

      document.getElementById("resultArea").style.display = "block";
    }

    function runDemo() {
      document.getElementById("errorBox").style.display = "none";
      document.getElementById("promptInput").value = "Top 4 programming languages popularity";
      renderBars({
        title: "Top 4 Programming Languages (Demo Output)",
        items: [
          { label: "Python", value: 92 },
          { label: "JavaScript / TypeScript", value: 85 },
          { label: "Java", value: 68 },
          { label: "C++", value: 54 }
        ]
      });
    }

    async function generateChart() {
      const apiKey = document.getElementById("apiKeyInput").value.trim();
      const prompt = document.getElementById("promptInput").value.trim();
      const btn = document.getElementById("btn");
      const errorBox = document.getElementById("errorBox");

      errorBox.style.display = "none";

      if (!apiKey) return alert("Please paste your Gemini API key—or click '✨ Try Demo Mode'!");
      if (!prompt) return alert("Please type a topic first!");

      btn.innerText = "Thinking...";
      btn.disabled = true;

      try {
        const response = await fetch(
          `https://googleapis.com{apiKey}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `Create realistic chart data for: "${prompt}". Return ONLY valid JSON in this exact format: {"title": "Chart Title", "items": [{"label": "Name", "value": 80}]}. Values must be between 10 and 100.`
                }]
              }],
              generationConfig: { responseMimeType: "application/json" }
            })
          }
        );

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error?.message || "API request failed");
        }

        const rawText = data.candidates.at(0).content.parts.at(0).text;
        const chartData = JSON.parse(rawText);
        renderBars(chartData);
      } catch (err) {
        errorBox.innerText = "Error: " + err.message + " (Tip: Check if an ad-blocker or Wi-Fi firewall is blocking Google APIs.)";
        errorBox.style.display = "block";
      } finally {
        btn.innerText = "Generate";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
