<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Visual Dashboard</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6">

  <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
    <h1 class="text-2xl font-bold mb-1">AI Mini Dashboard</h1>
    <p class="text-slate-400 text-sm mb-4">Generate instant visual charts using Gemini AI.</p>

    <!-- Safe API Key Input Box -->
    <div class="mb-4">
      <input id="apiKeyInput" type="password" placeholder="Paste your Google AI Studio API Key here..."
        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-slate-300 focus:outline-none focus:border-blue-500" />
    </div>

    <!-- Topic Prompt Box -->
    <div class="flex gap-2 mb-6">
      <input id="promptInput" type="text" placeholder="e.g., Top 4 programming languages popularity"
        class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500" />
      <button onclick="generateChart()" id="btn"
        class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-xl text-sm font-medium transition">
        Generate
      </button>
    </div>

    <!-- Error Message Box -->
    <div id="errorBox" class="hidden mb-4 p-3 rounded-xl bg-red-950/60 border border-red-800 text-red-300 text-xs"></div>

    <!-- Output Area -->
    <div id="resultArea" class="hidden space-y-4">
      <h2 id="chartTitle" class="text-lg font-semibold text-blue-400"></h2>
      <div id="barsContainer" class="space-y-3"></div>
    </div>
  </div>

  <script>
    async function generateChart() {
      const apiKey = document.getElementById("apiKeyInput").value.trim();
      const prompt = document.getElementById("promptInput").value.trim();
      const btn = document.getElementById("btn");
      const errorBox = document.getElementById("errorBox");

      errorBox.classList.add("hidden");

      if (!apiKey) return alert("Please paste your Gemini API key in the top box first!");
      if (!prompt) return alert("Please type a topic first!");

      btn.innerText = "Thinking...";
      btn.disabled = true;

      try {
        const response = await fetch(
          `https://googleapis.com{apiKey}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `Create realistic chart data for: "${prompt}". Return ONLY valid JSON in this exact format: {"title": "Chart Title", "items": [{"label": "Name", "value": 80}]}. Values must be between 10 and 100.`
                }]
              }],
              generationConfig: { responseMimeType: "application/json" }
            })
          }
        );

        const data = await response.json();

        // Check if Google API returned an actual error
        if (!response.ok || data.error) {
          throw new Error(data.error?.message || "API request failed");
        }

        // Fixed array indexing [0]
        const rawText = data.candidates[0].content.parts[0].text;
        const chartData = JSON.parse(rawText);

        document.getElementById("chartTitle").innerText = chartData.title;
        const container = document.getElementById("barsContainer");
        container.innerHTML = "";

        chartData.items.forEach(item => {
          container.innerHTML += `
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span>${item.label}</span>
                <span class="text-slate-400">${item.value}%</span>
              </div>
              <div class="w-full bg-slate-800 rounded-full h-3">
                <div class="bg-blue-500 h-3 rounded-full transition-all duration-500" style="width: ${item.value}%"></div>
              </div>
            </div>
          `;
        });

        document.getElementById("resultArea").classList.remove("hidden");
      } catch (err) {
        errorBox.innerText = "Error: " + err.message;
        errorBox.classList.remove("hidden");
      } finally {
        btn.innerText = "Generate";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
